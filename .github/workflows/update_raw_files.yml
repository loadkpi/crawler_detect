name: Update Raw Crawler Files

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-raw-files:
    name: Update Raw Files
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Execute raw files update
        run: |
          set -euxo pipefail
          bash ./bin/update_raw_files
        timeout-minutes: 5

      - name: Bump patch version if raw files changed
        id: bump
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes in raw files, skipping version bump."
            exit 0
          fi
          NEW_VERSION=$(ruby -e '
            path = "lib/crawler_detect/version.rb"
            src = File.read(path)
            src.sub!(/VERSION = "(\d+)\.(\d+)\.(\d+)"/) do
              "VERSION = \"#{$1}.#{$2}.#{$3.to_i + 1}\""
            end or abort("VERSION pattern not found")
            File.write(path, src)
            puts src[/VERSION = "([^"]+)"/, 1]
          ')
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          # GITHUB_TOKEN does not trigger CI on created PRs,
          # so a fine-grained PAT (contents + pull-requests: write) is required
          token: ${{ secrets.UPDATE_RAW_FILES_TOKEN || github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: "update-raw-files"
          delete-branch: true
          labels: automated

          commit-message: |
            Update raw crawler files (v${{ steps.bump.outputs.version }})

            Automated update of crawlers data from upstream source.

          title: "Automated: Update raw crawlers files (v${{ steps.bump.outputs.version }})"
          body: |
            ## Update raw crawler files

            This pull request contains automated update of crawlers data from upstream source.

            Bumps gem version to `${{ steps.bump.outputs.version }}` — merging this PR publishes the new version to RubyGems.

            ---
            *This PR was created automatically by the `update_raw_files` GitHub Action.*

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.UPDATE_RAW_FILES_TOKEN || github.token }}
        run: gh pr merge --auto --squash "${{ steps.create-pr.outputs.pull-request-number }}" --repo "${{ github.repository }}"
